apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.tumuyan.fixedplay"
        minSdkVersion 9
        targetSdkVersion 33
        versionCode 14
        versionName "1.13"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    lintOptions {
        // support-v4 25.4.0 is intentionally retained because it still supports API 9.
        disable 'GradleCompatible'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                outputFileName = "Anylauncher-${variant.versionName}.apk"
            }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:support-v4:25.4.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'net.dongliu:apk-parser:2.6.4'

    implementation 'com.github.bumptech.glide:glide:3.8.0'
}
